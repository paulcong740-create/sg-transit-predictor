# .github/workflows/volume.yml
# Every week, checks LTA for new monthly passenger volume data (every bus stop + every MRT/LRT station)
# and saves it into data/volume/ if there's a new month.

name: Download passenger volume

on:
  schedule:
    - cron: "17 3 * * 1"     # every Monday, 11:17 am Singapore time
  workflow_dispatch:         # adds a "Run workflow" button to run it by hand

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests python-dotenv

      - name: Download the latest month
        env:
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
        run: python download_volume.py

      - name: Save to GitHub (only if there's a new month)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/volume
          if git diff --cached --quiet; then
            echo "No new month yet"
            exit 0
          fi
          git commit -m "Add monthly passenger volume data"
          git pull --rebase
          git push
